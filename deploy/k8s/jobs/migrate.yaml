apiVersion: batch/v1
kind: Job
metadata:
  generateName: flippars-api-migrate-
  namespace: flippars
  labels:
    app.kubernetes.io/name: flippars-migration
    app.kubernetes.io/part-of: flippars
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flippars-migration
        app.kubernetes.io/part-of: flippars
        app.kubernetes.io/component: migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/iam30d/flippars-api:replace-me
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/src/db/migrate.js"]
          envFrom:
            - configMapRef:
                name: flippars-api
            - secretRef:
                name: flippars-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
