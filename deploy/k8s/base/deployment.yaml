apiVersion: apps/v1
kind: Deployment
metadata:
  name: flippars-api
  labels:
    app.kubernetes.io/name: flippars-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: flippars-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flippars-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/iam30d/flippars-api:replace-me
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: flippars-api
            - secretRef:
                name: flippars-api-secrets
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
