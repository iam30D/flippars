apiVersion: v1
kind: ConfigMap
metadata:
  name: flippars-api
data:
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: "8080"
  LOG_LEVEL: info
  MARKET_FEEDS: coinbase,kraken,binance
  SIMULATED_FEED_ENABLED: "false"
  MARKET_MIN_HEALTHY_VENUES: "3"
  # Public reads stay available during provider degradation; signal policy still abstains.
  REQUIRE_MARKET_FOR_READINESS: "false"
  SIGNALS_ENABLED: "false"
  MODEL_PROVIDER: disabled
  APNS_ENABLED: "false"
