apiVersion: batch/v1
kind: CronJob
metadata:
  name: flippars-retention
  labels:
    app.kubernetes.io/name: flippars-retention
    app.kubernetes.io/part-of: flippars
    app.kubernetes.io/component: retention
spec:
  schedule: "23 * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: flippars-retention
            app.kubernetes.io/part-of: flippars
            app.kubernetes.io/component: retention
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: retention
              image: ghcr.io/iam30d/flippars-api:replace-me
              imagePullPolicy: IfNotPresent
              command:
                - node
                - dist/src/db/retention-cli.js
                - --batch-size=1000
                - --max-rows-per-table=100000
              envFrom:
                - configMapRef:
                    name: flippars-api
                - secretRef:
                    name: flippars-api-secrets
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
